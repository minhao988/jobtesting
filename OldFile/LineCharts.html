<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Overview</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #salesChart {
            margin: auto;
            width: 80%;
            height: 500px;
        }
    </style>
</head>
<body>
    <div id="salesChart"></div>
    <script type="text/javascript">
      google.charts.load('current', { packages: ['corechart', 'line'] });
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {
        const data = new google.visualization.DataTable();
        data.addColumn('string', 'Month');
        data.addColumn('number', 'Member Sales');
        data.addColumn('number', 'Guest Sales');

        data.addRows([
          ['January', 150, 100],
          ['February', 200, 150],
          ['March', 250, 200],
          ['April', 300, 250],
          ['May', 350, 300],
          ['June', 400, 350],
          ['July', 450, 400],
        ]);

        const options = {
          title: 'Member & Guest Sales Overview',
          curveType: 'function',
          legend: { position: 'bottom' },
          colors: ['#1f77b4', '#ff7f0e'],
          hAxis: {
            title: 'Month',
            textStyle: { color: '#333' },
            titleTextStyle: { color: '#333', fontSize: 16 },
          },
          vAxis: {
            title: 'Sales',
            minValue: 0,
            textStyle: { color: '#333' },
            titleTextStyle: { color: '#333', fontSize: 16 },
          },
          areaOpacity: 0.3, // 设置区域透明度
          width: 900,
          height: 500,
          pointSize: 5, // 点的大小
        };

        const chart = new google.visualization.AreaChart(document.getElementById('salesChart'));
        chart.draw(data, options);
      }
    </script>
</body>
</html>
